name: CI

on:
    push:
        branches:
            - main
    pull_request:
    schedule:
        # weekly audit: the shipped vendor folder only updates on releases,
        # so advisories in the embedded dependencies must be noticed actively
        - cron: '0 6 * * 1'

jobs:
    tests:
        runs-on: docker
        strategy:
            fail-fast: false
            matrix:
                php: ['8.2', '8.3', '8.4', '8.5']
        name: PHP ${{ matrix.php }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up PHP
              uses: https://github.com/shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: ctype, curl, dom, exif, fileinfo, gd, iconv, intl, json, mbstring, simplexml, xml, xmlwriter, xsl, zip
                  tools: composer:v2

            - name: Validate composer.json
              run: composer validate --no-check-publish

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

            - name: Run PHPUnit
              run: php -d memory_limit=512M vendor/bin/phpunit

    audit:
        runs-on: docker

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up PHP
              uses: https://github.com/shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  tools: composer:v2

            - name: Audit dependencies
              run: composer audit --locked
