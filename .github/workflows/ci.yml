name: CI

on:
  push:
  pull_request:
  schedule:
    # weekly audit: the shipped vendor folder only updates on releases,
    # so advisories in the embedded dependencies must be noticed actively
    - cron: '0 6 * * 1'

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, ctype, curl, dom, gd

      - run: composer validate --no-check-publish

      - run: composer update --no-interaction --no-progress

      - run: composer test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - run: composer audit --locked
